---
# =============================================================================
# Windows .NET 3-Tier (CleanArchitecture) — App Server VM
# Builds & runs the jasontaylordev/CleanArchitecture ASP.NET Core Web API
# (IIS via the ASP.NET Core Module / Hosting Bundle, in-process, port
# {{ dotnet_app_port }}), connected to SQL Server on the database VM. Hosting
# under IIS (rather than Kestrel/NSSM) lets Azure Migrate discover it as a
# .NET/IIS web app. Selected when group_vars: dotnet_3tier_app == 'cleanarch'
#
# Assumptions (jasontaylordev/CleanArchitecture, .NET 10 layout):
#   - Web host project:      src/Web/Web.csproj
#   - EF migrations project: src/Infrastructure/Infrastructure.csproj
#   - Connection string key: ConnectionStrings:CleanArchitectureDb
#   - Angular SPA lives in   src/Web/ClientApp (built during publish — Node req'd)
# Node.js is installed so `dotnet publish` can build the bundled SPA; the
# genuine, separately-built frontend is served by win-dotnet-cleanarch-frontend.yml
# =============================================================================
- name: Deploy CleanArchitecture App Server (Windows .NET 3-Tier)
  hosts: win_dotnet_cln_appserver
  gather_facts: true
  become: false
  vars_files:
    - ../../group_vars/all.yml
  vars:
    db_host: "{{ hostvars[groups['win_dotnet_cln_database'][0]]['ansible_host'] | default(groups['win_dotnet_cln_database'][0]) }}"
    cleanarch_repo: "{{ dotnet_cleanarch_repo | default('https://github.com/jasontaylordev/CleanArchitecture.git') }}"
    cleanarch_branch: "{{ dotnet_cleanarch_branch | default('main') }}"
    cleanarch_db_name: "{{ dotnet_cleanarch_db_name | default('CleanArchitectureDb') }}"
    ca_src: C:\Apps\CleanArchitecture
    ca_repo: C:\Apps\CleanArchitecture\repo
    ca_published: C:\Apps\CleanArchitecture\published
    ca_logs: C:\Apps\CleanArchitecture\logs
    ca_conn: "Server={{ db_host }};Database={{ cleanarch_db_name }};User Id=SA;Password={{ mssql_sa_password }};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"

  tasks:
    - name: Install Chocolatey
      win_shell: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
      args:
        creates: C:\ProgramData\chocolatey\bin\choco.exe

    - name: Install Git, NSSM and Node.js LTS via Chocolatey
      win_chocolatey:
        name: "{{ item }}"
        state: present
      loop:
        - git
        - nssm
        - nodejs-lts

    - name: Install .NET 10 SDK (official dotnet-install script)
      win_shell: |
        $ErrorActionPreference = "Stop"
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        $installDir = "C:\Program Files\dotnet"
        $have10 = Get-ChildItem -Path "$installDir\sdk" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '10.*' }
        if (-not $have10) {
          $script = Join-Path $env:TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile $script -UseBasicParsing
          & $script -Channel 10.0 -InstallDir $installDir
          Write-Output "INSTALLED_10"
        }
        $machinePath = [System.Environment]::GetEnvironmentVariable("Path","Machine")
        if ($machinePath -notlike "*$installDir*") {
          [System.Environment]::SetEnvironmentVariable("Path", ($machinePath.TrimEnd(';') + ";" + $installDir), "Machine")
        }
        & "$installDir\dotnet.exe" --list-sdks
      register: dotnet10_install
      changed_when: "'INSTALLED_10' in (dotnet10_install.stdout | default(''))"

    - name: Refresh environment PATH
      win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        dotnet --version
      register: dotnet_check
      changed_when: false

    - name: Create app directories
      win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - '{{ ca_src }}'
        - '{{ ca_logs }}'
        - '{{ ca_src }}\temp'

    - name: Clone CleanArchitecture repository
      win_shell: >
        & "C:/Program Files/Git/bin/git.exe" clone -b {{ cleanarch_branch }}
        {{ cleanarch_repo }} "{{ ca_repo }}"
      args:
        creates: '{{ ca_repo }}\src\Web\Web.csproj'

    # The repo enables NuGet auditing with TreatWarningsAsErrors=true; transitive-package
    # CVE advisories (NU1902/NU1903) would fail the build. A root Directory.Build.targets
    # is imported AFTER the repo's Directory.Build.props and overrides those settings.
    - name: Neutralise NuGet audit / warnings-as-errors (deploy-time build)
      win_copy:
        dest: '{{ ca_repo }}\Directory.Build.targets'
        content: |
          <Project>
            <PropertyGroup>
              <NuGetAudit>false</NuGetAudit>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
              <MSBuildTreatWarningsAsErrors>false</MSBuildTreatWarningsAsErrors>
              <WarningsNotAsErrors>$(WarningsNotAsErrors);NU1901;NU1902;NU1903;NU1904</WarningsNotAsErrors>
              <!-- The template selects its DB provider with a `dotnet new` compile symbol;
                   a raw clone defaults to the #else (SQLite) branch. Define UseSqlServer so
                   `options.UseSqlServer(...)` + EnrichSqlServerDbContext target the SQL Server
                   database VM. The SqlServer EF packages are already referenced in the clone. -->
              <DefineConstants>$(DefineConstants);UseSqlServer</DefineConstants>
            </PropertyGroup>
            <!-- The API server does not need the Angular SPA (the frontend VM builds and
                 serves it). Override the template's PublishRunWebpack target with an empty
                 one so `dotnet publish` never invokes npm/ng build and reliably emits the
                 API assembly. -->
            <Target Name="PublishRunWebpack" AfterTargets="ComputeFilesToPublish" />
          </Project>

    # Re-point the repo's pinned SDK (e.g. 10.0.201) at whatever 10.x SDK is installed
    # so the build never fails on a patch-version mismatch.
    - name: Align global.json to the installed .NET SDK
      win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        $installed = (dotnet --list-sdks | ForEach-Object { ($_ -split ' ')[0] } | Sort-Object { [version]$_ } | Select-Object -Last 1)
        $json = '{ "sdk": { "version": "' + $installed + '", "rollForward": "latestFeature" } }'
        Set-Content -Path "{{ ca_repo }}\global.json" -Value $json -Encoding ascii
      changed_when: false

    - name: Write appsettings.json (point the DB connection at the database VM)
      win_copy:
        dest: '{{ ca_repo }}\src\Web\appsettings.json'
        content: |
          {
            "UseInMemoryDatabase": false,
            "ConnectionStrings": {
              "CleanArchitectureDb": "{{ ca_conn }}"
            },
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*"
          }

    - name: Wait for SQL Server on database VM
      win_wait_for:
        host: "{{ db_host }}"
        port: 1433
        timeout: 120
        state: started

    - name: Install dotnet-ef global tool
      win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User") + ";$env:USERPROFILE\.dotnet\tools"
        dotnet tool install --global dotnet-ef --version 10.* 2>&1 | Out-String
        dotnet tool update  --global dotnet-ef --version 10.* 2>&1 | Out-String
      register: ef_tool
      changed_when: false
      ignore_errors: true

    - name: Apply EF Core migrations to the database VM (best effort)
      win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User") + ";$env:USERPROFILE\.dotnet\tools"
        $env:DOTNET_CLI_HOME = "{{ ca_src }}\temp"
        $env:DOTNET_NOLOGO = "1"
        $env:DOTNET_CLI_TELEMETRY_OPTOUT = "1"
        $env:DOTNET_GENERATE_ASPNET_CERTIFICATE = "false"
        Set-Location "{{ ca_repo }}"
        # Restore first so the migrations build finds artifacts/obj/.../project.assets.json
        dotnet restore 2>&1 | Out-String
        # The template ships no migrations (they are scaffolded by `dotnet new`); generate an
        # initial SQL Server migration (UseSqlServer is defined via Directory.Build.targets).
        $migDir = "{{ ca_repo }}\src\Infrastructure\Data\Migrations"
        $hasMig = Get-ChildItem -Path $migDir -Filter *.cs -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'Snapshot' }
        if (-not $hasMig) {
          dotnet ef migrations add InitialCreate `
            --project src/Infrastructure/Infrastructure.csproj `
            --startup-project src/Web/Web.csproj `
            --output-dir Data/Migrations 2>&1 | Out-String
        }
        dotnet ef database update `
          --project src/Infrastructure/Infrastructure.csproj `
          --startup-project src/Web/Web.csproj `
          --connection "{{ ca_conn }}" 2>&1 | Out-String
      register: ef_update
      changed_when: false
      ignore_errors: true
      timeout: 900

    - name: Show EF migration result
      debug:
        msg: "{{ (ef_update.stdout | default('')) | regex_replace('(?i)password=[^;\"]*', 'Password=***') }}"

    - name: Build and publish CleanArchitecture Web project
      win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        $env:DOTNET_CLI_HOME = "{{ ca_src }}\temp"
        $env:DOTNET_NOLOGO = "1"
        $env:DOTNET_CLI_TELEMETRY_OPTOUT = "1"
        $env:DOTNET_GENERATE_ASPNET_CERTIFICATE = "false"
        Set-Location "{{ ca_repo }}"
        # UseArtifactsOutput=false forces the classic per-project output layout so that the
        # -o flag is honoured (the template enables .NET artifacts output, which otherwise
        # redirects publish to repo\artifacts\publish\... and ignores -o).
        dotnet publish src/Web/Web.csproj -c Release -o "{{ ca_published }}" -p:UseArtifactsOutput=false -p:NuGetAudit=false -p:TreatWarningsAsErrors=false 2>&1 | Out-String
        exit $LASTEXITCODE
      register: build_result
      timeout: 1200

    - name: Show publish output (diagnostic)
      debug:
        msg: "{{ (build_result.stdout | default('')) | regex_replace('(?i)password=[^;\"]*', 'Password=***') }}"

    - name: List candidate publish outputs (diagnostic)
      win_shell: |
        "=== contents of {{ ca_published }} ==="
        Get-ChildItem -Path "{{ ca_published }}" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
        "=== every runtimeconfig.json under the repo ==="
        Get-ChildItem -Path "{{ ca_repo }}" -Recurse -Filter *.runtimeconfig.json -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
      register: pub_diag
      changed_when: false

    - name: Show candidate publish outputs (diagnostic)
      debug:
        var: pub_diag.stdout_lines

    - name: Find published entry DLL (stage from artifacts publish dir if needed)
      win_shell: |
        $pub = "{{ ca_published }}"
        $rc = Get-ChildItem -Path $pub -Filter *.runtimeconfig.json -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $rc) {
          # The .NET artifacts-output feature may have placed publish output under artifacts/publish/...
          $artRoot = Join-Path "{{ ca_repo }}" "artifacts"
          $art = Get-ChildItem -Path $artRoot -Recurse -Filter *.runtimeconfig.json -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -like '*Web*' } | Select-Object -First 1
          if (-not $art) {
            $art = Get-ChildItem -Path "{{ ca_repo }}" -Recurse -Filter *.runtimeconfig.json -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -like '*Web*' -and $_.FullName.ToLower().Contains('publish') } | Select-Object -First 1
          }
          if ($art) {
            New-Item -ItemType Directory -Path $pub -Force | Out-Null
            Copy-Item -Path (Join-Path $art.DirectoryName '*') -Destination $pub -Recurse -Force
            $rc = Get-ChildItem -Path $pub -Filter *.runtimeconfig.json -ErrorAction SilentlyContinue | Select-Object -First 1
          }
        }
        if ($rc) { $rc.Name.Replace('.runtimeconfig.json', '.dll') } else { "Web.dll" }
      register: entry_dll
      changed_when: false

    - name: Verify published entry DLL exists
      win_stat:
        path: '{{ ca_published }}\{{ entry_dll.stdout | trim }}'
      register: web_dll
      failed_when: not web_dll.stat.exists

    - name: Detect dotnet.exe full path
      win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        (Get-Command dotnet).Source
      register: dotnet_exe
      changed_when: false

    # -------------------------------------------------------------------------
    # Host the API under IIS (ASP.NET Core Module / Hosting Bundle, in-process)
    # instead of Kestrel/NSSM, so Azure Migrate discovers it as a .NET/IIS web
    # app. The IIS site binds {{ dotnet_app_port }} — the same port the frontend
    # VM reverse-proxies to — so the dependency chain is unchanged.
    # -------------------------------------------------------------------------
    - name: Install IIS with required features
      win_feature:
        name:
          - Web-Server
          - Web-Mgmt-Console
          - Web-Mgmt-Tools
          - Web-Static-Content
          - Web-Default-Doc
        state: present
      register: iis_install

    - name: Reboot if IIS install requires it
      win_reboot:
      when: iis_install.reboot_required | default(false)

    # The ASP.NET Core Hosting Bundle ships the AspNetCoreModuleV2 (ANCM) that IIS
    # needs to host the app in-process. The Chocolatey package is
    # "dotnet-windowshosting" (metapackage → latest GA hosting bundle, currently
    # .NET 10); "dotnet-hosting" does NOT exist on the community feed.
    - name: Install ASP.NET Core Hosting Bundle (provides AspNetCoreModuleV2)
      win_chocolatey:
        name: dotnet-windowshosting
        state: present

    - name: Ensure IIS stdout log directory exists
      win_file:
        path: '{{ ca_logs }}\iis'
        state: directory

    - name: Write web.config for in-process ASP.NET Core hosting
      win_copy:
        dest: '{{ ca_published }}\web.config'
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="{{ dotnet_exe.stdout | trim }}"
                            arguments=".\{{ entry_dll.stdout | trim }}"
                            stdoutLogEnabled="true"
                            stdoutLogFile="{{ ca_logs }}\iis\stdout"
                            hostingModel="inprocess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />
                    <environmentVariable name="DOTNET_ROOT" value="C:\Program Files\dotnet" />
                  </environmentVariables>
                </aspNetCore>
              </system.webServer>
            </location>
          </configuration>

    - name: Stop and remove any legacy NSSM Kestrel service (migration from old deploy)
      win_shell: |
        if (Get-Service CleanArchitecture -ErrorAction SilentlyContinue) {
          nssm stop CleanArchitecture
          nssm remove CleanArchitecture confirm
          'removed'
        } else { 'absent' }
      register: nssm_cleanup
      changed_when: "'removed' in nssm_cleanup.stdout"
      ignore_errors: true

    - name: Create IIS application pool (No Managed Code)
      win_iis_webapppool:
        name: CleanArchitecture
        state: started
        attributes:
          managedRuntimeVersion: ""
          startMode: AlwaysRunning

    - name: Remove default IIS website
      win_iis_website:
        name: "Default Web Site"
        state: absent

    - name: Create IIS website bound to the app port
      win_iis_website:
        name: CleanArchitecture
        state: started
        port: "{{ dotnet_app_port }}"
        physical_path: '{{ ca_published }}'
        application_pool: CleanArchitecture
      register: iis_site

    - name: Grant the app pool identity read access to the published folder
      win_acl:
        path: '{{ ca_published }}'
        user: "IIS AppPool\\CleanArchitecture"
        rights: ReadAndExecute
        type: allow
        state: present
        inherit: 'ContainerInherit, ObjectInherit'
        propagation: 'None'

    - name: Grant the app pool identity write access to the log folder
      win_acl:
        path: '{{ ca_logs }}'
        user: "IIS AppPool\\CleanArchitecture"
        rights: Modify
        type: allow
        state: present
        inherit: 'ContainerInherit, ObjectInherit'
        propagation: 'None'

    - name: Reset IIS to load the ASP.NET Core Module
      win_shell: iisreset /restart
      changed_when: false

    - name: Wait for CleanArchitecture to start responding
      win_uri:
        url: "http://localhost:{{ dotnet_app_port }}/"
        return_content: false
        status_code: [200, 302, 404]
      register: ca_check
      retries: 18
      delay: 10
      until: ca_check.status_code is defined and ca_check.status_code in [200, 302, 404]
      ignore_errors: true

    - name: Show CleanArchitecture startup status
      debug:
        msg: "CleanArchitecture API (IIS) is {{ 'running' if ca_check is succeeded else 'NOT responding — check ' + ca_logs + '\\iis\\stdout*.log' }}"

    - name: Show ASP.NET Core stdout log if site failed to start
      win_shell: >
        Get-ChildItem "{{ ca_logs }}\iis\stdout*.log" -ErrorAction SilentlyContinue |
        Sort-Object LastWriteTime | Select-Object -Last 1 |
        Get-Content -Tail 50 -ErrorAction SilentlyContinue
      register: stdout_log
      changed_when: false
      when: ca_check is failed

    - name: Display diagnostic logs
      debug:
        msg:
          - "=== ASP.NET Core stdout (last 50 lines) ==="
          - "{{ stdout_log.stdout_lines | default(['(empty)']) }}"
      when: ca_check is failed

    - name: Allow app port through Windows Firewall
      win_firewall_rule:
        name: "CleanArchitecture HTTP"
        localport: "{{ dotnet_app_port }}"
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true
