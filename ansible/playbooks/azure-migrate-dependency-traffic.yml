---
# =============================================================================
# Azure Migrate — Dependency-analysis traffic generator
#
# Azure Migrate agentless dependency analysis only maps a dependency when the
# appliance OBSERVES an established TCP connection between two VMs at the moment
# it polls (it reads netstat on a periodic cycle, ~every 5 min). An idle 3-tier
# app therefore shows no dependencies.
#
# This playbook deploys a small "probe" agent to every 1-tier and 3-tier VM
# (Linux + Windows) that periodically opens the REAL inter-tier connections
# (frontend -> appserver -> database, per stack) and HOLDS each connection open
# long enough (default 330s) to overlap at least one appliance poll, so the
# dependency is reliably captured. A scheduled job re-runs it every 15 minutes.
#
# Optionally, a common file server (SMB 445 / NFS 2049) and/or DNS server
# (port 53) shared by all 1-tier and 3-tier VMs can be probed too.
#
# Probe technique:
#   Linux   : bash /dev/tcp (held open via sleep); nslookup/dig for DNS
#   Windows : System.Net.Sockets.TcpClient (held open); Resolve-DnsName for DNS
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini playbooks/azure-migrate-dependency-traffic.yml \
#     [-e dep_file_server_ip=10.20.1.10] \
#     [-e dep_dns_server_ip=10.20.1.4] \
#     [-e dep_hold_seconds=330] \
#     [-e dep_state=present|absent] -v
#
# Tear down with: -e dep_state=absent
# =============================================================================

# --- Play 1: Linux VMs (1-tier legacy_apps + 3-tier legacy_apps_3tier) -------
- name: Deploy dependency traffic generator (Linux)
  hosts: legacy_apps:legacy_apps_3tier
  gather_facts: false
  become: true
  vars:
    dg_state: "{{ dep_state | default('present') }}"
    dg_hold: "{{ dep_hold_seconds | default(330) }}"
    dg_file_ip: "{{ dep_file_server_ip | default('') }}"
    dg_dns_ip: "{{ dep_dns_server_ip | default('') }}"
    dg_smb_port: "{{ dep_smb_port | default(445) }}"
    dg_nfs_port: "{{ dep_nfs_port | default(2049) }}"
    dg_dns_port: "{{ dep_dns_port | default(53) }}"
    # Per-stack realistic flow: each source tier probes the next tier in its
    # own stack, on that tier's actual listening port.
    dep_flow_map:
      java_frontend:    { target_group: java_appserver,   port: 9966 }
      java_appserver:   { target_group: java_database,    port: 5432 }
      dotnet_frontend:  { target_group: dotnet_appserver, port: 5000 }
      dotnet_appserver: { target_group: dotnet_database,  port: 1433 }
      php_frontend:     { target_group: php_appserver,    port: 8000 }
      php_appserver:    { target_group: php_database,     port: 3306 }

  tasks:
    # ---- Removal path -----------------------------------------------------
    - name: Remove cron schedule (teardown)
      ansible.builtin.cron:
        name: azmigrate-dep-probe
        state: absent
      when: dg_state == 'absent'

    - name: Remove probe files (teardown)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/azmigrate/dep-probe.sh
        - /opt/azmigrate/endpoints.conf
      when: dg_state == 'absent'

    # ---- Install path -----------------------------------------------------
    - name: Create probe directory
      ansible.builtin.file:
        path: /opt/azmigrate
        state: directory
        mode: '0755'
      when: dg_state != 'absent'

    - name: Generate per-host endpoint list
      ansible.builtin.copy:
        dest: /opt/azmigrate/endpoints.conf
        mode: '0644'
        content: |
          # Auto-generated by azure-migrate-dependency-traffic.yml
          # Format: ip|port|proto|label   (proto: tcp|dns)
          {% for src_grp, flow in dep_flow_map.items() %}
          {% if inventory_hostname in groups.get(src_grp, []) and (groups.get(flow.target_group, []) | length) > 0 %}
          {{ groups[flow.target_group][0] }}|{{ flow.port }}|tcp|{{ src_grp }}_to_{{ flow.target_group }}
          {% endif %}
          {% endfor %}
          {% if dg_file_ip | length > 0 %}
          {{ dg_file_ip }}|{{ dg_smb_port }}|tcp|smb_fileserver
          {{ dg_file_ip }}|{{ dg_nfs_port }}|tcp|nfs_fileserver
          {% endif %}
          {% if dg_dns_ip | length > 0 %}
          {{ dg_dns_ip }}|{{ dg_dns_port }}|dns|dns_server
          {% endif %}
      when: dg_state != 'absent'

    - name: Deploy probe script
      ansible.builtin.copy:
        dest: /opt/azmigrate/dep-probe.sh
        mode: '0755'
        content: |
          #!/usr/bin/env bash
          # Azure Migrate dependency-analysis traffic generator (Linux).
          # Opens each configured connection and HOLDS it open so the Azure
          # Migrate appliance's periodic netstat poll observes it. DNS targets
          # are queried in a loop for the same duration.
          set -u
          CONF="/opt/azmigrate/endpoints.conf"
          LOG="/var/log/azmigrate-depprobe.log"
          HOLD={{ dg_hold }}
          [ -f "$CONF" ] || exit 0
          ts() { date '+%F %T'; }

          probe_tcp() {
            local ip="$1" port="$2" label="$3"
            if timeout "$HOLD" bash -c "exec 3<>/dev/tcp/$ip/$port; sleep $HOLD" 2>/dev/null; then
              echo "$(ts) HELD $label $ip:$port/tcp ${HOLD}s" >> "$LOG"
            else
              echo "$(ts) FAIL $label $ip:$port/tcp" >> "$LOG"
            fi
          }

          probe_dns() {
            local ip="$1" port="$2" label="$3"
            local end=$(( $(date +%s) + HOLD ))
            while [ "$(date +%s)" -lt "$end" ]; do
              if command -v nslookup >/dev/null 2>&1; then
                nslookup -timeout=2 azure.microsoft.com "$ip" >/dev/null 2>&1
              elif command -v dig >/dev/null 2>&1; then
                dig +time=2 +tries=1 "@$ip" azure.microsoft.com >/dev/null 2>&1
              else
                timeout 2 bash -c "exec 3<>/dev/udp/$ip/$port" >/dev/null 2>&1
              fi
              sleep 10
            done
            echo "$(ts) DNS-LOOP $label $ip:$port/dns ${HOLD}s" >> "$LOG"
          }

          pids=()
          while IFS='|' read -r ip port proto label; do
            ip="$(echo "${ip:-}" | tr -d '[:space:]')"
            [ -z "$ip" ] && continue
            case "$ip" in \#*) continue ;; esac
            case "$proto" in
              dns) probe_dns "$ip" "$port" "$label" & ;;
              *)   probe_tcp "$ip" "$port" "$label" & ;;
            esac
            pids+=("$!")
          done < "$CONF"
          wait
          # keep the log bounded
          if [ -f "$LOG" ]; then
            tail -n 5000 "$LOG" > "$LOG.tmp" 2>/dev/null && mv "$LOG.tmp" "$LOG"
          fi
          exit 0
      when: dg_state != 'absent'

    - name: Schedule probe every 15 minutes (cron)
      ansible.builtin.cron:
        name: azmigrate-dep-probe
        minute: "*/15"
        job: "/opt/azmigrate/dep-probe.sh >/dev/null 2>&1"
        state: present
      when: dg_state != 'absent'

    - name: Seed traffic immediately (fire-and-forget)
      ansible.builtin.command: /opt/azmigrate/dep-probe.sh
      async: "{{ (dg_hold | int) + 60 }}"
      poll: 0
      changed_when: false
      when: dg_state != 'absent'

    - name: Verify each TCP endpoint NOW (short connect, logs OK/FAIL)
      ansible.builtin.shell: |
        CONF=/opt/azmigrate/endpoints.conf
        LOG=/var/log/azmigrate-depprobe.log
        ts=$(date '+%F %T')
        [ -f "$CONF" ] || { echo "NO_CONF"; exit 0; }
        while IFS='|' read -r ip port proto label; do
          ip=$(echo "${ip:-}" | tr -d '[:space:]'); [ -z "$ip" ] && continue
          case "$ip" in \#*) continue ;; esac
          if [ "$proto" = dns ]; then
            if timeout 3 bash -c "exec 3<>/dev/udp/$ip/$port" 2>/dev/null; then r="OK"; else r="FAIL"; fi
          else
            if timeout 3 bash -c "exec 3<>/dev/tcp/$ip/$port" 2>/dev/null; then r="OK"; else r="FAIL"; fi
          fi
          echo "$ts CHECK $r $label $ip:$port/$proto" | tee -a "$LOG"
        done < "$CONF"
      register: dep_check
      changed_when: false
      when: dg_state != 'absent'

    - name: Show connectivity check result (server-level pass/fail)
      ansible.builtin.debug:
        msg: "{{ dep_check.stdout_lines | default(['(no result)']) }}"
      when: dg_state != 'absent' and dep_check is defined

    - name: Show last 15 held-connection log lines
      ansible.builtin.command: tail -n 15 /var/log/azmigrate-depprobe.log
      register: dep_log_tail
      changed_when: false
      failed_when: false
      when: dg_state != 'absent'

    - name: Display held-connection log tail
      ansible.builtin.debug:
        msg: "{{ dep_log_tail.stdout_lines | default(['(log empty - probe may still be running)']) }}"
      when: dg_state != 'absent' and dep_log_tail is defined

    - name: Report Linux endpoint plan
      ansible.builtin.command: cat /opt/azmigrate/endpoints.conf
      register: dep_conf_out
      changed_when: false
      when: dg_state != 'absent'

    - name: Show what this host will probe
      ansible.builtin.debug:
        msg: "{{ dep_conf_out.stdout_lines | reject('match', '^\\s*#') | reject('equalto', '') | list }}"
      when: dg_state != 'absent' and dep_conf_out is defined

# --- Play 2: Windows VMs (1-tier win_servers + 3-tier win_servers_3tier) -----
- name: Deploy dependency traffic generator (Windows)
  hosts: win_servers:win_servers_3tier
  gather_facts: false
  become: false
  vars:
    dg_state: "{{ dep_state | default('present') }}"
    dg_hold: "{{ dep_hold_seconds | default(330) }}"
    dg_file_ip: "{{ dep_file_server_ip | default('') }}"
    dg_dns_ip: "{{ dep_dns_server_ip | default('') }}"
    dg_smb_port: "{{ dep_smb_port | default(445) }}"
    dg_nfs_port: "{{ dep_nfs_port | default(2049) }}"
    dg_dns_port: "{{ dep_dns_port | default(53) }}"
    dep_flow_map:
      win_java_frontend:    { target_group: win_java_appserver,   port: 9966 }
      win_java_appserver:   { target_group: win_java_database,    port: 5432 }
      win_dotnet_frontend:  { target_group: win_dotnet_appserver, port: 5000 }
      win_dotnet_appserver: { target_group: win_dotnet_database,  port: 1433 }
      win_php_frontend:     { target_group: win_php_appserver,    port: 8000 }
      win_php_appserver:    { target_group: win_php_database,     port: 3306 }

  tasks:
    # ---- Removal path -----------------------------------------------------
    - name: Remove scheduled task (teardown)
      ansible.windows.win_shell: schtasks /Delete /TN "AzureMigrateDepProbe" /F
      failed_when: false
      changed_when: false
      when: dg_state == 'absent'

    - name: Remove probe directory (teardown)
      ansible.windows.win_file:
        path: C:\azmigrate
        state: absent
      when: dg_state == 'absent'

    # ---- Install path -----------------------------------------------------
    - name: Create probe directory
      ansible.windows.win_file:
        path: C:\azmigrate
        state: directory
      when: dg_state != 'absent'

    - name: Generate per-host endpoint list
      ansible.windows.win_copy:
        dest: C:\azmigrate\endpoints.conf
        content: |
          # Auto-generated by azure-migrate-dependency-traffic.yml
          # Format: ip|port|proto|label   (proto: tcp|dns)
          {% for src_grp, flow in dep_flow_map.items() %}
          {% if inventory_hostname in groups.get(src_grp, []) and (groups.get(flow.target_group, []) | length) > 0 %}
          {{ groups[flow.target_group][0] }}|{{ flow.port }}|tcp|{{ src_grp }}_to_{{ flow.target_group }}
          {% endif %}
          {% endfor %}
          {% if dg_file_ip | length > 0 %}
          {{ dg_file_ip }}|{{ dg_smb_port }}|tcp|smb_fileserver
          {{ dg_file_ip }}|{{ dg_nfs_port }}|tcp|nfs_fileserver
          {% endif %}
          {% if dg_dns_ip | length > 0 %}
          {{ dg_dns_ip }}|{{ dg_dns_port }}|dns|dns_server
          {% endif %}
      when: dg_state != 'absent'

    - name: Deploy probe script
      ansible.windows.win_copy:
        dest: C:\azmigrate\dep-probe.ps1
        content: |
          # Azure Migrate dependency-analysis traffic generator (Windows).
          # Opens each configured TCP connection and HOLDS it open (parallel
          # background jobs) so the Azure Migrate appliance's periodic netstat
          # poll observes the connection. DNS targets are queried in a loop.
          $ErrorActionPreference = 'SilentlyContinue'
          $conf = 'C:\azmigrate\endpoints.conf'
          $log  = 'C:\azmigrate\dep-probe.log'
          $hold = {{ dg_hold }}
          if (-not (Test-Path $conf)) { exit 0 }

          $jobs = @()
          foreach ($line in Get-Content $conf) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line.TrimStart().StartsWith('#')) { continue }
              $f = $line.Split('|')
              if ($f.Count -lt 4) { continue }
              $ip = $f[0].Trim(); $port = $f[1].Trim(); $proto = $f[2].Trim(); $label = $f[3].Trim()
              $jobs += Start-Job -ScriptBlock {
                  param($ip, $port, $proto, $label, $hold, $log)
                  $ts = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
                  try {
                      if ($proto -eq 'dns') {
                          $end = (Get-Date).AddSeconds($hold)
                          while ((Get-Date) -lt $end) {
                              Resolve-DnsName -Name 'azure.microsoft.com' -Server $ip -QuickTimeout -ErrorAction SilentlyContinue | Out-Null
                              Start-Sleep -Seconds 10
                          }
                          Add-Content -Path $log -Value "$ts DNS-LOOP $label ${ip}:$port/dns ${hold}s"
                      } else {
                          $c = New-Object System.Net.Sockets.TcpClient
                          $c.Connect($ip, [int]$port)
                          Start-Sleep -Seconds $hold
                          $c.Close()
                          Add-Content -Path $log -Value "$ts HELD $label ${ip}:$port/tcp ${hold}s"
                      }
                  } catch {
                      Add-Content -Path $log -Value "$ts FAIL $label ${ip}:$port/$proto"
                  }
              } -ArgumentList $ip, $port, $proto, $label, $hold, $log
          }
          if ($jobs.Count -gt 0) {
              Wait-Job -Job $jobs -Timeout ($hold + 30) | Out-Null
              Remove-Job -Job $jobs -Force
          }
          # keep the log bounded
          try {
              $lines = Get-Content $log -ErrorAction SilentlyContinue
              if ($lines -and $lines.Count -gt 5000) { $lines[-5000..-1] | Set-Content $log }
          } catch {}
          exit 0
      when: dg_state != 'absent'

    - name: Schedule probe every 15 minutes (Scheduled Task as SYSTEM)
      ansible.windows.win_shell: >
        schtasks /Create /TN "AzureMigrateDepProbe"
        /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\azmigrate\dep-probe.ps1"
        /SC MINUTE /MO 15 /RU SYSTEM /RL HIGHEST /F
      changed_when: true
      when: dg_state != 'absent'

    - name: Seed traffic immediately (runs in background)
      ansible.windows.win_shell: schtasks /Run /TN "AzureMigrateDepProbe"
      changed_when: false
      when: dg_state != 'absent'

    - name: Verify each TCP endpoint NOW (short connect, logs OK/FAIL)
      ansible.windows.win_shell: |
        $conf = 'C:\azmigrate\endpoints.conf'
        $log  = 'C:\azmigrate\dep-probe.log'
        if (-not (Test-Path $conf)) { 'NO_CONF'; exit 0 }
        foreach ($line in Get-Content $conf) {
          if ([string]::IsNullOrWhiteSpace($line)) { continue }
          if ($line.TrimStart().StartsWith('#')) { continue }
          $f = $line.Split('|'); if ($f.Count -lt 4) { continue }
          $ip = $f[0].Trim(); $port = $f[1].Trim(); $proto = $f[2].Trim(); $label = $f[3].Trim()
          $t = Test-NetConnection -ComputerName $ip -Port $port -WarningAction SilentlyContinue
          $r = if ($t.TcpTestSucceeded) { 'OK' } else { 'FAIL' }
          $ts = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          $msg = "$ts CHECK $r $label ${ip}:$port/$proto"
          $msg
          Add-Content -Path $log -Value $msg
        }
      register: dep_check_win
      changed_when: false
      when: dg_state != 'absent'

    - name: Show connectivity check result (server-level pass/fail)
      ansible.builtin.debug:
        msg: "{{ dep_check_win.stdout_lines | default(['(no result)']) }}"
      when: dg_state != 'absent' and dep_check_win is defined

    - name: Show last 15 held-connection log lines
      ansible.windows.win_shell: if (Test-Path C:\azmigrate\dep-probe.log) { Get-Content C:\azmigrate\dep-probe.log -Tail 15 }
      register: dep_log_win
      changed_when: false
      failed_when: false
      when: dg_state != 'absent'

    - name: Display held-connection log tail
      ansible.builtin.debug:
        msg: "{{ dep_log_win.stdout_lines | default(['(log empty - probe may still be running)']) }}"
      when: dg_state != 'absent' and dep_log_win is defined

    - name: Report Windows endpoint plan
      ansible.windows.win_shell: Get-Content C:\azmigrate\endpoints.conf
      register: dep_conf_win
      changed_when: false
      when: dg_state != 'absent'

    - name: Show what this host will probe
      ansible.builtin.debug:
        msg: "{{ dep_conf_win.stdout_lines | reject('match', '^\\s*#') | reject('equalto', '') | list }}"
      when: dg_state != 'absent' and dep_conf_win is defined
