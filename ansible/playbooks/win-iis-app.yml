---
# =============================================================================
# Windows .NET VM — eShopOnWeb ASP.NET Core 8 + SQL Server 2019 Express
# Same eShopOnWeb app as 3-tier, running on a single VM with local SQL Server.
# Hosted under IIS + ASP.NET Core Module V2 (in-process) so Azure Migrate
# discovers it as a .NET/IIS web app (Kestrel/NSSM leaves no IIS site to find).
# =============================================================================
- name: Deploy eShopOnWeb + SQL Server on Windows (1-Tier)
  hosts: win_dotnet_servers
  gather_facts: true
  become: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    eshop_src: C:\Apps\eShopOnWeb
    eshop_published: C:\Apps\eShopOnWeb\published
    eshop_logs: C:\Apps\eShopOnWeb\logs

  tasks:
    # ---------------------------------------------------------------
    # SQL Server 2019 Express (silent install)
    # ---------------------------------------------------------------
    - name: Check if SQL Server is already installed
      win_service:
        name: MSSQLSERVER
      register: mssql_svc
      ignore_errors: true

    - name: Create SQL Server installer directory
      win_file:
        path: C:\SQLInstall
        state: directory
      when: mssql_svc.state is not defined or mssql_svc.state != 'running'

    - name: Download SQL Server 2019 Express installer
      win_get_url:
        url: https://go.microsoft.com/fwlink/?linkid=866658
        dest: C:\SQLInstall\SQL2019-SSEI-Expr.exe
      when: mssql_svc.state is not defined or mssql_svc.state != 'running'

    - name: Download SQL Server media
      win_command: >
        C:\SQLInstall\SQL2019-SSEI-Expr.exe /Action=Download
        /MediaPath=C:\SQLInstall /MediaType=Core /Quiet
      args:
        creates: C:\SQLInstall\SQLEXPR_x64_ENU.exe
      when: mssql_svc.state is not defined or mssql_svc.state != 'running'

    - name: Extract SQL Server media
      win_command: >
        C:\SQLInstall\SQLEXPR_x64_ENU.exe /x:C:\SQLInstall\extracted /Q
      args:
        creates: C:\SQLInstall\extracted\setup.exe
      when: mssql_svc.state is not defined or mssql_svc.state != 'running'

    - name: Install SQL Server 2019 Express
      win_command: >
        C:\SQLInstall\extracted\setup.exe /Q /IACCEPTSQLSERVERLICENSETERMS
        /ACTION=Install /FEATURES=SQLENGINE
        /INSTANCENAME=MSSQLSERVER
        /SECURITYMODE=SQL
        /SAPWD="{{ mssql_sa_password }}"
        /SQLSVCACCOUNT="NT AUTHORITY\SYSTEM"
        /TCPENABLED=1
        /UpdateEnabled=False
      args:
        creates: C:\Program Files\Microsoft SQL Server\MSSQL15.MSSQLSERVER
      when: mssql_svc.state is not defined or mssql_svc.state != 'running'
      register: sql_install

    - name: Reboot after SQL Server install
      win_reboot:
      when: sql_install is changed

    - name: Ensure SQL Server service is running
      win_service:
        name: MSSQLSERVER
        start_mode: auto
        state: started

    - name: Ensure SQL Server Browser is running
      win_service:
        name: SQLBrowser
        start_mode: auto
        state: started

    # ---------------------------------------------------------------
    # Wait for SQL Server readiness + TCP verification
    # ---------------------------------------------------------------
    - name: Wait for SQL Server to be ready
      win_command: >
        sqlcmd -S localhost -U SA -P "{{ mssql_sa_password }}"
        -Q "SELECT 1"
      register: sql_ready
      retries: 12
      delay: 10
      until: sql_ready.rc == 0
      changed_when: false

    - name: Ensure SQL Server TCP/IP protocol is enabled
      win_shell: |
        Import-Module SQLPS -DisableNameChecking -ErrorAction SilentlyContinue
        $wmi = New-Object Microsoft.SqlServer.Management.Smo.Wmi.ManagedComputer $env:COMPUTERNAME
        $tcp = $wmi.ServerInstances['MSSQLSERVER'].ServerProtocols['Tcp']
        if (-not $tcp.IsEnabled) {
          $tcp.IsEnabled = $true
          $tcp.Alter()
          Restart-Service MSSQLSERVER -Force
          Write-Output "TCP enabled and service restarted"
        } else {
          Write-Output "TCP already enabled"
        }
      register: tcp_result
      changed_when: "'restarted' in tcp_result.stdout"
      ignore_errors: true

    # ---------------------------------------------------------------
    # Create database
    # ---------------------------------------------------------------
    - name: Create application database
      win_command: >
        sqlcmd -S localhost -U SA -P "{{ mssql_sa_password }}"
        -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name='{{ mssql_db_name }}') CREATE DATABASE [{{ mssql_db_name }}]"
      changed_when: false

    # ---------------------------------------------------------------
    # Chocolatey + Dependencies
    # ---------------------------------------------------------------
    - name: Install Chocolatey
      win_shell: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
      args:
        creates: C:\ProgramData\chocolatey\bin\choco.exe

    - name: Install Git via Chocolatey
      win_chocolatey:
        name: "{{ item }}"
        state: present
      loop:
        - git

    - name: Install .NET 8 SDK
      win_chocolatey:
        name: dotnet-8.0-sdk
        state: present

    - name: Refresh environment PATH
      win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        dotnet --version
      register: dotnet_check
      changed_when: false

    # ---------------------------------------------------------------
    # eShopOnWeb Application (same as 3-tier app server)
    # ---------------------------------------------------------------
    - name: Create app directories
      win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - '{{ eshop_src }}'
        - '{{ eshop_logs }}'
        - '{{ eshop_src }}\temp'

    - name: Clone eShopOnWeb repository
      win_shell: >
        & "C:/Program Files/Git/bin/git.exe" clone
        https://github.com/dotnet-architecture/eShopOnWeb.git
        "{{ eshop_src }}/repo"
      args:
        creates: '{{ eshop_src }}\repo\eShopOnWeb.sln'

    - name: Write appsettings.json for eShopOnWeb
      win_copy:
        dest: '{{ eshop_src }}\repo\src\Web\appsettings.json'
        content: |
          {
            "baseUrls": {
              "apiBase": "http://0.0.0.0:{{ dotnet_app_port }}/api/",
              "webBase": "http://0.0.0.0:{{ dotnet_app_port }}/"
            },
            "ConnectionStrings": {
              "CatalogConnection": "Server=localhost;Database={{ mssql_db_name }};User Id=SA;Password={{ mssql_sa_password }};TrustServerCertificate=True;",
              "IdentityConnection": "Server=localhost;Database={{ mssql_db_name }};User Id=SA;Password={{ mssql_sa_password }};TrustServerCertificate=True;"
            },
            "CatalogBaseUrl": "",
            "Logging": {
              "LogLevel": {
                "Default": "Warning",
                "Microsoft": "Warning",
                "System": "Warning"
              }
            },
            "AllowedHosts": "*"
          }

    - name: Remove environment-specific appsettings overrides
      win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - '{{ eshop_src }}\repo\src\Web\appsettings.Docker.json'
        - '{{ eshop_src }}\repo\src\Web\appsettings.Development.json'

    - name: Build and publish eShopOnWeb
      win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        Set-Location "{{ eshop_src }}/repo"
        dotnet publish src/Web/Web.csproj -c Release -o "{{ eshop_published }}"
      register: build_result
      timeout: 600

    - name: Verify published output exists
      win_stat:
        path: '{{ eshop_published }}\Web.dll'
      register: web_dll
      failed_when: not web_dll.stat.exists

    - name: Copy appsettings.json to published directory (runtime override)
      win_copy:
        src: '{{ eshop_src }}\repo\src\Web\appsettings.json'
        dest: '{{ eshop_published }}\appsettings.json'
        remote_src: true

    - name: Detect dotnet.exe full path
      win_shell: (Get-Command dotnet).Source
      register: dotnet_exe
      changed_when: false

    - name: Detect dotnet root directory
      win_shell: Split-Path "{{ dotnet_exe.stdout | trim }}"
      register: dotnet_root_dir
      changed_when: false

    # -------------------------------------------------------------------------
    # Host eShopOnWeb under IIS (ASP.NET Core Module V2, in-process) instead of
    # Kestrel/NSSM, so Azure Migrate discovers it as a .NET/IIS web app. IIS binds
    # {{ dotnet_app_port }} — the same port the app previously served on.
    # -------------------------------------------------------------------------
    - name: Install IIS with required features
      win_feature:
        name:
          - Web-Server
          - Web-Mgmt-Console
          - Web-Mgmt-Tools
          - Web-Static-Content
          - Web-Default-Doc
        state: present
      register: iis_install

    - name: Reboot if IIS install requires it
      win_reboot:
      when: iis_install.reboot_required | default(false)

    # The ASP.NET Core 8 Hosting Bundle ships the AspNetCoreModuleV2 (ANCM) plus
    # the ASP.NET Core 8 runtime IIS needs to host the app in-process. The
    # version-matched Chocolatey package for this .NET 8 app is
    # "dotnet-8.0-windowshosting" (metapackage: .NET runtime + ASP.NET Core
    # runtime + ANCM V2).
    - name: Install ASP.NET Core 8 Hosting Bundle (provides AspNetCoreModuleV2)
      win_chocolatey:
        name: dotnet-8.0-windowshosting
        state: present

    - name: Ensure IIS stdout log directory exists
      win_file:
        path: '{{ eshop_logs }}\iis'
        state: directory

    - name: Write web.config for in-process ASP.NET Core hosting
      win_copy:
        dest: '{{ eshop_published }}\web.config'
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="{{ dotnet_exe.stdout | trim }}"
                            arguments=".\Web.dll"
                            stdoutLogEnabled="true"
                            stdoutLogFile="{{ eshop_logs }}\iis\stdout"
                            hostingModel="inprocess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Docker" />
                    <environmentVariable name="DOTNET_ROOT" value="C:\Program Files\dotnet" />
                  </environmentVariables>
                </aspNetCore>
              </system.webServer>
            </location>
          </configuration>

    - name: Stop and remove any legacy NSSM Kestrel service (migration from old deploy)
      win_shell: |
        if (Get-Service eShopOnWeb -ErrorAction SilentlyContinue) {
          nssm stop eShopOnWeb
          nssm remove eShopOnWeb confirm
          'removed'
        } else { 'absent' }
      register: nssm_cleanup
      changed_when: "'removed' in nssm_cleanup.stdout"
      ignore_errors: true

    - name: Create IIS application pool (No Managed Code)
      win_iis_webapppool:
        name: eShopOnWeb
        state: started
        attributes:
          managedRuntimeVersion: ""
          startMode: AlwaysRunning

    - name: Remove default IIS website
      win_iis_website:
        name: "Default Web Site"
        state: absent

    - name: Create IIS website bound to the app port
      win_iis_website:
        name: eShopOnWeb
        state: started
        port: "{{ dotnet_app_port }}"
        physical_path: '{{ eshop_published }}'
        application_pool: eShopOnWeb
      register: iis_site

    - name: Grant the app pool identity read access to the published folder
      win_acl:
        path: '{{ eshop_published }}'
        user: "IIS AppPool\\eShopOnWeb"
        rights: ReadAndExecute
        type: allow
        state: present
        inherit: 'ContainerInherit, ObjectInherit'
        propagation: 'None'

    - name: Grant the app pool identity write access to the log folder
      win_acl:
        path: '{{ eshop_logs }}'
        user: "IIS AppPool\\eShopOnWeb"
        rights: Modify
        type: allow
        state: present
        inherit: 'ContainerInherit, ObjectInherit'
        propagation: 'None'

    - name: Reset IIS to load the ASP.NET Core Module
      win_shell: iisreset /restart
      changed_when: false

    - name: Wait for eShopOnWeb to start responding
      win_uri:
        url: "http://localhost:{{ dotnet_app_port }}/"
        return_content: false
        status_code: [200, 302, 404]
      register: eshop_check
      retries: 18
      delay: 10
      until: eshop_check.status_code is defined and eshop_check.status_code in [200, 302, 404]
      ignore_errors: true

    - name: Show eShopOnWeb startup status
      debug:
        msg: "eShopOnWeb (IIS) is {{ 'running' if eshop_check is succeeded else 'NOT responding — check ' + eshop_logs + '\\iis\\stdout*.log' }}"

    - name: Show ASP.NET Core stdout log if site failed to start
      win_shell: >
        Get-ChildItem "{{ eshop_logs }}\iis\stdout*.log" -ErrorAction SilentlyContinue |
        Sort-Object LastWriteTime | Select-Object -Last 1 |
        Get-Content -Tail 50 -ErrorAction SilentlyContinue
      register: stdout_log
      changed_when: false
      when: eshop_check is failed

    - name: Display diagnostic logs
      debug:
        msg:
          - "=== ASP.NET Core stdout (last 50 lines) ==="
          - "{{ stdout_log.stdout_lines | default(['(empty)']) }}"
      when: eshop_check is failed

    # ---------------------------------------------------------------
    # Firewall
    # ---------------------------------------------------------------
    - name: Allow app port through Windows Firewall
      win_firewall_rule:
        name: "eShopOnWeb HTTP"
        localport: "{{ dotnet_app_port }}"
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true

    - name: Allow SQL Server (port 1433) through Windows Firewall
      win_firewall_rule:
        name: "SQL Server Inbound"
        localport: 1433
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true

    # ---------------------------------------------------------------
    # WinRM + RDP — keep available for Azure Migrate
    # ---------------------------------------------------------------
    - name: Ensure WinRM service is running
      win_service:
        name: WinRM
        start_mode: auto
        state: started

    - name: Enable RDP for Azure Migrate
      win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: Allow RDP through firewall
      win_firewall_rule:
        name: "Remote Desktop"
        localport: 3389
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true
